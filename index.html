<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tech | V14</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --primary: #66fcf1;
            --accent: #45f3ff;
            --text: #ffffff;
            --surface: #1f2833;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 255, 242, 0.1);
            border: 1px solid rgba(102, 252, 241, 0.2);
            width: 90%;
            max-width: 600px;
        }

        h1 { color: var(--primary); margin-bottom: 25px; }

        select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid var(--primary);
            background: var(--bg-color);
            color: var(--text);
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            cursor: pointer;
        }

        button {
            background: var(--primary);
            color: var(--bg-color);
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        #canvas-container {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            display: none;
        }

        /* CUSTOM IN-UI MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 9999;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: var(--surface);
            border: 2px solid var(--primary);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.3);
        }

        .modal-box h3 { color: var(--primary); margin-top: 0; }
        .modal-box p { margin: 15px 0 20px 0; line-height: 1.5; color: #fff; }
        
        .modal-btn {
            background: var(--primary);
            color: var(--bg-color);
            border: none; padding: 10px 25px;
            border-radius: 5px; font-weight: bold; cursor: pointer;
            margin-top: 10px; width: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nova Tech V14</h1>
        
        <select id="engine-select">
            <option value="rsdkv5">Sonic Mania (RSDKv5)</option>
            <option value="rsdkv3">Sonic CD (RSDKv3)</option>
            <option value="retroarch">S1/S2(Emulatrix)</option>
        </select>

        <select id="game-select"></select>

        <button id="init-btn">Initialize Engine</button>

        <div id="canvas-container">
            <iframe id="game-frame" src="" tabindex="0"></iframe>
        </div>
    </div>

    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>System Message</h3>
            <p>Powering up core systems... This will take a bit to load.</p>
            <button class="modal-btn" onclick="closeModal()">Acknowledge</button>
        </div>
    </div>

    <script>
        // Mapped straight to your local directory setup
        const engineConfig = {
            rsdkv5: [{ name: "Sonic Mania", file: "Mania/index.html" }],
            rsdkv3: [{ name: "Sonic CD", file: "CD/index.html" }],
            retroarch: [
                { name: "Sonic the Hedgehog 1", file: "emulatrix/index.html?rom=Sonic1.md" },
                { name: "Sonic the Hedgehog 2", file: "emulatrix/index.html?rom=Sonic2.md" }
            ]
        };

        const engineSelect = document.getElementById('engine-select');
        const gameSelect = document.getElementById('game-select');
        const initBtn = document.getElementById('init-btn');
        const gameFrame = document.getElementById('game-frame');
        const modal = document.getElementById('custom-modal');

        function updateGameList() {
            gameSelect.innerHTML = '';
            const selectedEngine = engineSelect.value;
            engineConfig[selectedEngine].forEach(game => {
                const opt = document.createElement('option');
                opt.value = game.file;
                opt.textContent = game.name;
                gameSelect.appendChild(opt);
            });
        }

        // Custom UI Alert Controls
        function closeModal() {
            modal.classList.remove('active');
        }

        engineSelect.addEventListener('change', updateGameList);
        
        initBtn.addEventListener('click', () => {
            const targetFile = gameSelect.value;
            if (!targetFile) return;

            // Triggering the custom UI notice instead of standard browser dialog.
            modal.classList.add('active');

            gameFrame.src = targetFile;
            gameFrame.style.display = "block";
            gameFrame.focus();
        });

        // Initialize default view
        updateGameList();
    </script>
</body>
</html>
