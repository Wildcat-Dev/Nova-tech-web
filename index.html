<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova Tech | V13</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <script src="coi-serviceworker.js"></script>
    
    <style>
        :root { 
            --liquid-glass: rgba(255, 255, 255, 0.08); 
            --border-glow: rgba(255, 255, 255, 0.15); 
            --accent: #00a2ff;
            --warning: #ffae00;
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', sans-serif; 
            color: white; 
        }

        /* Viewport Logic */
        #viewport { 
            display: flex; 
            width: 300vw; 
            height: 100vh; 
            transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1); 
        }

        .screen { 
            width: 100vw; 
            height: 100vh; 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }

        /* Screen-Specific Backgrounds */
        #main-screen { background-image: url('phone.png'); }
        #games-screen { background-color: #050505; background-image: url('games.png'); }
        #comms-screen { background-image: url('comms.png'); }

        /* Android Asset Scaling */
        @media (max-width: 1024px) {
            #main-screen { background-image: url('phoneandroid.png') !important; }
            #games-screen { background-image: url('gamesandroid.png') !important; }
            #comms-screen { background-image: url('commsandroid.png') !important; }
        }

        /* Navigation HUD */
        nav {
            position: fixed; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 12px 25px;
            border-radius: 15px; 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glow); 
            z-index: 1000; 
            transition: all 0.6s ease-in-out;
        }

        .nav-side-mode { 
            left: 30px; 
            transform: translateX(0); 
            align-items: flex-start; 
        }

        .nav-buttons { display: flex; gap: 8px; }
        
        button { 
            background: #111; 
            border: 1px solid #333; 
            color: #888; 
            padding: 8px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 11px; 
            transition: 0.3s; 
        }

        button.active { 
            background: var(--accent); 
            color: #fff; 
            border-color: var(--accent); 
            box-shadow: 0 0 15px rgba(0,162,255,0.4); 
        }

        /* Interaction Bars */
        .controls-bar {
            margin-bottom: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap; 
            justify-content: center;
            padding: 15px; 
            border-radius: 12px; 
            background: var(--liquid-glass); 
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow); 
            z-index: 10;
        }

        select, .action-btn { 
            background: rgba(0,0,0,0.8); 
            color: white; 
            border: 1px solid #444; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 12px; 
        }

        .action-btn:hover { background: #fff; color: #000; }

        /* The Engine Housing */
        #emu-container { 
            width: 90%; 
            max-width: 900px; 
            height: 500px; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #333; 
            position: relative;
        }

        iframe { width: 100%; height: 100%; border: none; }

        #status-bar { 
            width: 100%; 
            background: #000; 
            color: #0f0; 
            font-family: monospace; 
            font-size: 11px; 
            padding: 8px 15px; 
            border-top: 1px solid #222; 
            transition: color 0.5s; 
            box-sizing: border-box;
        }

        /* --- MODAL, SETTINGS & OVERLAY STYLING --- */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100vw; height:100vh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-box {
            background: #111; border: 1px solid var(--border-glow);
            padding: 25px; border-radius: 15px; max-width: 450px; width: 85%;
            text-align: center; box-shadow: 0 0 30px rgba(0,162,255,0.2);
        }
        .modal-box h3 { margin-top: 0; color: var(--accent); letter-spacing: 2px; }
        .modal-box p { font-size: 13px; color: #ccc; line-height: 1.6; margin: 15px 0; }
        
        /* Fixed overlay constraints updated for absolute nested execution contexts */
        #touch-controller {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; display: none;
        }
        .touch-btn {
            position: absolute; width: 60px; height: 60px;
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.8); font-family: monospace; font-size: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 50%; pointer-events: auto; user-select: none; -webkit-user-select: none;
            cursor: pointer; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .touch-btn span { font-size: 9px; text-transform: uppercase; margin-top: -2px; color: #bbb; }
        
        /* Adjusted layout percentages so it positions cleanly regardless of screen resolution scaling */
        #v-up    { bottom: 130px; left: 75px; }
        #v-down  { bottom: 20px;  left: 75px; }
        #v-left  { bottom: 75px;  left: 20px; }
        #v-right { bottom: 75px;  left: 130px; }
        
        #v-z { bottom: 30px; right: 30px; width: 75px; height: 75px; font-size: 24px; }
        #v-x { bottom: 115px; right: 37px; }
        
        #v-enter { bottom: 30px; left: 50%; transform: translateX(-50%); border-radius: 8px; width: 80px; height: 45px; font-size: 14px; }
        #v-fs    { top: 20px; right: 20px; border-radius: 8px; width: 50px; height: 50px; font-size: 14px; }

        /* Dynamic layout alignment adaptations applied native when container changes rules */
        #emu-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
        }
        #emu-container:fullscreen #iframe-target {
            height: 100% !important;
        }
        #emu-container:fullscreen #status-bar {
            display: none !important; /* Hide structural status block during active full render updates */
        }
    </style>
</head>
<body>

<nav id="mainNav">
    <h1 style="margin:0 0 5px 0; font-size:0.5rem; letter-spacing:5px; color: var(--accent);">NOVA TECH | V13</h1>
    <div class="nav-buttons">
        <button onclick="slideTo('main', 0)" id="btn-0" class="active">HOME</button>
        <button onclick="slideTo('games', 1)" id="btn-1">SONIC</button>
        <button onclick="slideTo('comms', 2)" id="btn-2">COMMS</button>
    </div>
</nav>

<div id="viewport">
    
    <div id="main-screen" class="screen">
    </div>

    <div id="games-screen" class="screen"> 
        <div class="controls-bar">
            <select id="engineType" onchange="updateEngineList()">
                <option value="rsdkv5">RSDK v5 (Mania)</option>
                <option value="rsdkv3">RSDK v3 (Sonic CD)</option>
                <option value="retroarch">RetroArch (S1/S2)</option>
            </select>
            
            <select id="gameSelect"></select>
            
            <button class="action-btn" onclick="bootEngine()" style="background: var(--accent);">INITIALIZE</button>
            <button class="action-btn" onclick="openSettings()" style="background: #222; border-color: #444;">SETTINGS</button>
            <button class="action-btn" onclick="toggleFullscreen()" style="background: #222; border-color: #444;">FULLSCREEN</button>
        </div>

        <!-- THE HOUSING CONTAINER: FULLSCREEN TARGET -->
        <div id="emu-container">
            <div id="iframe-target" style="width:100%; height:calc(100% - 27px); position: relative;">
                <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#151515; font-weight:bold;">SONIC ENGINE STANDBY</div>
            </div>
            
            <!-- NESTED INTERACTION INPUT OVERLAY (Stays visible during Fullscreen) -->
            <div id="touch-controller">
                <div class="touch-btn" id="v-up"    data-key="ArrowUp">o<span>Up</span></div>
                <div class="touch-btn" id="v-down"  data-key="ArrowDown">o<span>Down</span></div>
                <div class="touch-btn" id="v-left"  data-key="ArrowLeft">o<span>Left</span></div>
                <div class="touch-btn" id="v-right" data-key="ArrowRight">o<span>Right</span></div>
                
                <div class="touch-btn" id="v-z"     data-key="z">o<span>Z</span></div>
                <div class="touch-btn" id="v-x"     data-key="x">o<span>X</span></div>
                
                <div class="touch-btn" id="v-enter" data-key="Enter">o<span>Enter</span></div>
                <div class="touch-btn" id="v-fs"    onclick="toggleFullscreen()">o<span>FS</span></div>
            </div>

            <div id="status-bar">>Engine Ready. Select Game To Play.</div>
        </div>
    </div>

    <div id="comms-screen" class="screen">
        <h2 style="letter-spacing: 5px; text-transform: uppercase; font-size: 0.8rem; margin-bottom: 20px;">Secure Comms Channel</h2>
        <div class="controls-bar" style="width: 90%; max-width: 500px;">
            <input type="text" id="msg" style="flex-grow:1; background:none; border:none; color:white; outline:none; font-family: monospace;" placeholder="Enter transmission...">
            <button onclick="sendMessage()" class="action-btn">SEND</button>
        </div>
    </div>

</div>

<!-- SYSTEM MODALS -->
<div id="systemModal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modalTitle">SYSTEM NOTICE</h3>
        <p id="modalBody"></p>
        <button class="action-btn" onclick="closeModal()" style="background: var(--accent); width: 100px;">OK</button>
    </div>
</div>

<div id="settingsModal" class="modal-overlay">
    <div class="modal-box">
        <h3>ENGINE CONFIG</h3>
        <p style="text-align: left; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="touchControlsCheck" style="transform: scale(1.3);"> Enable Virtual Touch Controls
            </label>
        </p>
        <button class="action-btn" onclick="saveSettings()" style="background: var(--accent); width: 100px;">SAVE</button>
    </div>
</div>

<script>
    const engineConfig = {
        rsdkv5: [{ name: "Sonic Mania", file: "Mania/index.html" }],
        rsdkv3: [{ name: "Sonic CD", file: "CD/index.html" }],
        retroarch: [
            { name: "Sonic 1", file: "sonic1.zip" },
            { name: "Sonic 2", file: "sonic2.zip" }
        ]
    };

    let touchControlsEnabled = false;

    function updateEngineList() {
        const type = document.getElementById('engineType').value;
        const selector = document.getElementById('gameSelect');
        selector.innerHTML = '';
        
        engineConfig[type].forEach(game => {
            let opt = document.createElement('option');
            opt.value = game.file;
            opt.innerHTML = game.name;
            selector.appendChild(opt);
        });
    }

    function bootEngine() {
        const type = document.getElementById('engineType').value;
        const file = document.getElementById('gameSelect').value;
        const target = document.getElementById('iframe-target');
        const status = document.getElementById('status-bar');

        const confirmBoot = confirm("SYSTEM WARNING: Large file load detected (~400MB). It may take up to 30 seconds to start. Please wait patiently.");

        if (confirmBoot) {
            status.innerText = "> BOOTING MODULE... STANDBY FOR 30s.";
            status.style.color = "var(--warning)";
            
            target.innerHTML = `<iframe id="game-frame" src="${file}" tabindex="0"></iframe>`;
            
            setTimeout(() => {
                status.innerText = "> ENGINE STABILIZED. CONTROLS LOCKED TO GAME.";
                status.style.color = "#0f0";
                focusGame();
                
                showModal(
                    "INITIALIZATION HINT", 
                    "Hint: You can enable touch controls in settings, and press F11 on Windows or use the Fullscreen button and touch to enter full display."
                );
            }, 30000);
        } else {
            status.innerText = "> LOAD ABORTED.";
        }
    }

    function slideTo(name, index) {
        const vp = document.getElementById('viewport');
        const nav = document.getElementById('mainNav');
        
        vp.style.transform = `translateX(-${index * 100}vw)`;
        
        if (index > 0) {
            nav.classList.add('nav-side-mode');
        } else {
            nav.classList.remove('nav-side-mode');
        }

        document.querySelectorAll('.nav-buttons button').forEach((btn, i) => {
            btn.className = (i === index) ? 'active' : '';
        });
    }

    function sendMessage() {
        const input = document.getElementById("msg");
        const message = input.value.trim();
        if (!message) return;

        fetch("https://discord.com/api/webhooks/1492850737103765505/jV5m5oiaZjVpx95d_w3hhNOm09F-e113L4l61lSVBemtIETbQiFAm2wwabb33fIXf9Sw", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: message })
        })
        .then(res => {
            if (res.ok) { 
                input.value = ""; 
                alert("Transmission Sent."); 
            }
        });
    }

    function showModal(title, bodyText) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = bodyText;
        document.getElementById('systemModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('systemModal').style.display = 'none';
        focusGame();
    }

    function openSettings() {
        document.getElementById('touchControlsCheck').checked = touchControlsEnabled;
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function saveSettings() {
        touchControlsEnabled = document.getElementById('touchControlsCheck').checked;
        document.getElementById('settingsModal').style.display = 'none';
        document.getElementById('touch-controller').style.display = touchControlsEnabled ? 'block' : 'none';
        focusGame();
    }

    function toggleFullscreen() {
        const container = document.getElementById('emu-container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                alert(`Error attempts entering fullscreen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'F11') {
            e.preventDefault();
            toggleFullscreen();
        }
    });

    const emuContainer = document.getElementById('emu-container');

    function focusGame() {
        const frame = document.getElementById('game-frame');
        if (frame) {
            frame.setAttribute('tabindex', '0');
            frame.focus();
            if (frame.contentWindow) {
                frame.contentWindow.focus();
            }
        }
    }

    function unfocusGame() {
        window.focus();
    }

    emuContainer.addEventListener('touchstart', (e) => { focusGame(); e.stopPropagation(); }, { passive: true });
    emuContainer.addEventListener('mousedown', (e) => { focusGame(); e.stopPropagation(); });

    document.addEventListener('mousedown', (e) => {
        if (!emuContainer.contains(e.target) && !e.target.closest('.touch-btn') && !e.target.closest('.modal-box')) {
            unfocusGame();
        }
    });
    document.addEventListener('touchstart', (e) => {
        if (!emuContainer.contains(e.target) && !e.target.closest('.touch-btn') && !e.target.closest('.modal-box')) {
            unfocusGame();
        }
    }, { passive: true });

    /* --- TOUCH CONTROLS EVENT ROUTING INJECTOR --- */
    document.querySelectorAll('.touch-btn').forEach(btn => {
        const keyCode = btn.getAttribute('data-key');
        if (!keyCode) return;

        function handlePress(e) {
            e.preventDefault();
            focusGame();
            
            if(btn.childNodes.length > 0) btn.childNodes[0].nodeValue = "O";
            
            const frame = document.getElementById('game-frame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', {
                    key: keyCode, code: keyCode, bubbles: true, cancelable: true, view: frame.contentWindow
                }));
            }
        }

        function handleRelease(e) {
            e.preventDefault();
            
            if(btn.childNodes.length > 0) btn.childNodes[0].nodeValue = "o";

            const frame = document.getElementById('game-frame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.dispatchEvent(new KeyboardEvent('keyup', {
                    key: keyCode, code: keyCode, bubbles: true, cancelable: true, view: frame.contentWindow
                }));
            }
        }

        btn.addEventListener('touchstart', handlePress, { passive: false });
        btn.addEventListener('touchend', handleRelease, { passive: false });
        btn.addEventListener('mousedown', handlePress);
        btn.addEventListener('mouseup', handleRelease);
        btn.addEventListener('mouseleave', handleRelease);
    });

    // Initial setup
    updateEngineList();
</script>

</body>
</html>
