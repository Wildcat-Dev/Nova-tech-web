<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levian AI</title>
    <link rel="icon" type="image/png" href="LEVIANICON.png">
    
    <style>
        @font-face {
            font-family: 'Anurati';
            src: url('Anurati-Regular.otf') format('opentype');
        }

        :root {
            --bg-main: #000000;
            --bg-bar: #111111;
            --e-blue: #00f3ff;
            --g-yellow: #ffd700;
            --text-main: #ffffff;
            --text-muted: #555555;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* --- STATIC BRANDING ICON (Top Left) --- */
        #top-left-logo {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 35px;
            height: 35px;
            object-fit: contain;
            z-index: 110;
            transition: opacity 0.4s ease;
            opacity: 0.8;
        }
        
        /* Stays visible until the chat bar mode triggers */
        body.chat-active #top-left-logo {
            opacity: 0;
            pointer-events: none;
        }

        /* --- SIDEBAR & SETTINGS --- */
        #sidebar {
            width: 70px;
            height: 100%;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            background: var(--bg-main);
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
            position: relative;
            z-index: 20;
        }

        body.chat-active #sidebar {
            opacity: 1;
            transform: translateX(0);
        }

        .side-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 26px; transition: 0.3s;
            margin-top: auto;
            outline: none;
        }
        
        /* Hover turns neon blue, Active menu state turns golden */
        .side-btn:hover { color: var(--e-blue); filter: drop-shadow(0 0 8px var(--e-blue)); }
        .side-btn.active { color: var(--g-yellow) !important; filter: drop-shadow(0 0 8px var(--g-yellow)) !important; }

        /* Slide-out Settings Menu Container */
        #settings-menu {
            position: fixed;
            top: 0; 
            left: 70px;
            width: 240px; 
            height: 100%;
            background: #080808;
            border-right: 1px solid var(--border);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 15;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #settings-menu.open {
            transform: translateX(0);
        }

        .menu-title {
            font-family: 'Anurati', sans-serif;
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .save-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: #eee;
            font-size: 11px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .save-btn:hover { border-color: var(--e-blue); color: var(--e-blue); background: rgba(0, 243, 255, 0.05); }
        .save-btn:active { border-color: var(--g-yellow); color: var(--g-yellow); }

        /* --- NOTIFICATION TOAST --- */
        #toast {
            position: fixed;
            bottom: 110px;
            left: 90px;
            background: #111111;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 16px 35px 16px 20px;
            width: 290px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer; /* Makes the entire block feel like a clean link */
        }

        #toast:hover {
            border-color: var(--e-blue);
        }

        #toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        #toast .title { 
            font-family: 'Anurati', sans-serif; 
            font-size: 14px; 
            color: var(--text-main); 
            margin-bottom: 6px; 
            font-weight: bold;
            letter-spacing: 1px;
        }
        #toast .desc { 
            font-family: 'Segoe UI', sans-serif; 
            font-size: 12px; 
            color: #aaa; 
            line-height: 1.4;
        }
        #toast .desc span {
            color: var(--e-blue);
            text-decoration: underline;
        }
        #toast .close-btn { 
            position: absolute; 
            top: 12px; 
            right: 14px; 
            cursor: pointer; 
            color: #555; 
            font-size: 12px; 
            transition: 0.2s;
        }
        #toast .close-btn:hover { color: #fff; }

        /* --- MAIN AREA & LANDING ELEMENTS --- */
        #main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #beta-text {
            position: absolute;
            top: 22%;
            left: 8%; /* Shifted clean to the left side */
            font-family: 'Anurati', sans-serif;
            font-size: 16px;
            letter-spacing: 5px;
            color: var(--e-blue);
            text-transform: uppercase;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: opacity 0.4s ease;
            z-index: 5;
        }

        #hero-text {
            position: absolute;
            top: 76%; /* Lowered down significantly to fully clear logo area */
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ddd;
            transition: opacity 0.4s ease;
            text-align: center;
            width: 100%;
        }

        #hero-logo-center {
            position: fixed;
            top: 36%; /* Pushed higher up to give breathing room */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 256px;
            height: 256px;
            object-fit: contain;
            z-index: 50;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        body.chat-active #beta-text { opacity: 0; pointer-events: none; }
        body.chat-active #hero-text { opacity: 0; pointer-events: none; }
        body.chat-active #hero-logo-center { opacity: 0; transform: translate(-50%, -50%) scale(0.8); pointer-events: none; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- CHAT STREAM --- */
        #chat-stream {
            flex-grow: 1;
            padding: 40px 10%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.8s ease 0.4s;
            padding-bottom: 140px;
        }
        body.chat-active #chat-stream { opacity: 1; }

        .msg-wrapper {
            display: flex;
            width: 100%;
            gap: 15px;
            align-items: flex-start;
        }
        .msg-wrapper.user-wrapper {
            justify-content: flex-end;
        }

        /* Pure avatar asset mapping rules: No borders, backgrounds, or rings */
        .ai-avatar {
            width: 35px;
            height: 35px;
            object-fit: contain;
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            flex-shrink: 0;
        }
        
        .ai-avatar.thinking {
            animation: spin 2.2s linear infinite;
        }

        .msg { max-width: 75%; line-height: 1.6; font-size: 15px; padding: 12px 18px; border-radius: 12px; word-wrap: break-word; }
        .msg.user { background: #161616; border: 1px solid var(--border); color: #fff; }
        .msg.ai { background: transparent; color: #ccc; padding-left: 5px; }

        /* Ultra-fast cursor tick styles */
        .typing-cursor {
            font-weight: bold;
            color: var(--e-blue);
            animation: blink 0.4s steps(2, start) infinite;
            margin-left: 2px;
        }
        @keyframes blink { to { visibility: hidden; } }

        /* --- INPUT BAR --- */
        #input-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: var(--bg-bar);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            cursor: text;
            transition: all 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) { #input-container { width: 92%; } }
        #input-container:focus-within { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            resize: none;
            min-height: 24px;
            max-height: 120px;
            padding: 8px 0;
            overflow-y: auto;
        }
        
        textarea::placeholder { 
            color: var(--text-muted); 
            font-size: 14px; 
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .controls { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }

        select {
            background: #1a1a1a;
            color: #aaa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            -webkit-appearance: none;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: 0.3s;
        }
        .send-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .send-btn:hover { color: var(--e-blue); filter: drop-shadow(0 0 8px var(--e-blue)); }
    </style>
</head>
<body>

    <img src="LEVIANICON.png" id="top-left-logo" alt="Levian Core">
    <img src="LEVIANICON.png" id="hero-logo-center" alt="Levian AI">
