<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levian AI</title>
    
    <link rel="icon" type="image/png" href="LEVIANICON.png">
    <link rel="apple-touch-icon" href="LEVIANICON.png">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 6 Seconds Per Rotation, No Glow, Perfectly Centered */
        .levian-logo {
            width: 256px;
            height: 256px;
            object-fit: contain;
            animation: spin 6s linear infinite;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive scaling for smaller screens */
        @media (max-width: 480px), (orientation: portrait) {
            .levian-logo {
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>
<body>

    <img src="LEVIANICON.png" alt="Levian AI" class="levian-logo">

</body>
</html>
