<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levian AI</title>
    <link rel="icon" type="image/png" href="LEVIANICON.png">
    
    <style>
        /* Loading your custom Anurati font asset */
        @font-face {
            font-family: 'Anurati';
            src: url('Anurati-Regular.otf') format('opentype');
        }

        :root {
            --bg-main: #000000;
            --bg-bar: #111111;
            --e-blue: #00f3ff;
            --g-yellow: #ffd700;
            --text-main: #ffffff;
            --text-muted: #555555;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 70px;
            height: 100%;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
            position: relative;
            z-index: 10;
        }

        body.chat-active #sidebar {
            opacity: 1;
            transform: translateX(0);
        }

        .side-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 24px; transition: 0.3s;
            margin-top: auto;
        }
        .side-btn:hover { color: var(--e-blue); text-shadow: 0 0 10px var(--e-blue); }

        .save-btn {
            margin-top: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #aaa;
            font-size: 10px;
            padding: 10px 5px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .save-btn:hover { border-color: var(--e-blue); color: var(--e-blue); }
        .save-btn:active { border-color: var(--g-yellow); color: var(--g-yellow); }

        /* --- MAIN AREA & LANDING ELEMENTS --- */
        #main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #beta-text {
            position: absolute;
            top: 22%;
            left: 60%;
            transform: translate(-50%, -50%);
            font-family: 'Anurati', sans-serif;
            font-size: 16px;
            letter-spacing: 5px;
            color: var(--e-blue);
            text-transform: uppercase;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: opacity 0.4s ease;
            text-align: center;
            width: 100%;
            z-index: 5;
        }

        #hero-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ddd;
            transition: opacity 0.4s ease;
            text-align: center;
            width: 100%;
        }

        #hero-logo {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 256px;
            height: 256px;
            object-fit: contain;
            z-index: 50;
            transition: top 0.8s cubic-bezier(0.5, -0.4, 0.2, 1), 
                        left 0.8s cubic-bezier(0.5, -0.4, 0.2, 1), 
                        width 0.8s ease, 
                        height 0.8s ease,
                        transform 0.8s ease;
        }

        #hero-logo.spinning {
            animation: spin 3s linear infinite;
        }

        /* Fade out landing text layers upon active interaction */
        body.chat-active #beta-text { opacity: 0; pointer-events: none; }
        body.chat-active #hero-text { opacity: 0; pointer-events: none; }
        
        body.chat-active #hero-logo {
            top: 45px;
            left: 35px;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- CHAT STREAM --- */
        #chat-stream {
            flex-grow: 1;
            padding: 40px 10%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.8s ease 0.4s;
            padding-bottom: 120px;
        }
        body.chat-active #chat-stream { opacity: 1; }

        .msg { max-width: 80%; line-height: 1.6; font-size: 15px; padding: 12px 18px; border-radius: 12px; word-wrap: break-word; }
        .msg.user { align-self: flex-end; background: #1a1a1a; border: 1px solid var(--border); color: #fff; }
        .msg.ai { align-self: flex-start; background: transparent; color: #ccc; }

        /* --- INPUT BAR --- */
        #input-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: var(--bg-bar);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            cursor: text;
            transition: all 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) { #input-container { width: 92%; } }

        #input-container:focus-within { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            resize: none;
            min-height: 24px;
            max-height: 120px;
            padding: 8px 0;
            overflow-y: auto;
        }
        
        textarea::placeholder { 
            color: var(--text-muted); 
            font-size: 14px; 
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .controls { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }

        select {
            background: #1a1a1a;
            color: #aaa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            -webkit-appearance: none;
        }
        
        @media (hover: hover) {
            select:hover { border-color: var(--e-blue); box-shadow: 0 0 10px rgba(0,243,255,0.2); color: #fff; }
            select:active { border-color: var(--g-yellow); box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        }
        select:focus { border-color: var(--g-yellow); }
        @media (hover: none) {
            select:active { border-color: var(--g-yellow); box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: 0.3s;
        }
        .send-btn svg { width: 24px; height: 24px; fill: currentColor; }

        @media (hover: hover) {
            .send-btn:hover { color: var(--e-blue); filter: drop-shadow(0 0 8px var(--e-blue)); }
            .send-btn:active { color: var(--g-yellow); filter: drop-shadow(0 0 8px var(--g-yellow)); }
        }
        @media (hover: none) {
            .send-btn:active { color: var(--g-yellow); filter: drop-shadow(0 0 8px var(--g-yellow)); }
        }

        /* Cooldown Visual State */
        #input-container.cooldown-lock {
            border-color: #ff3333 !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.15);
        }
    </style>
</head>
<body>

    <img src="LEVIANICON.png" id="hero-logo" alt="Levian AI">

    <div id="sidebar">
        <button class="save-btn" onclick="saveChat()">Save<br>Chat</button>
        <button class="side-btn">⚙</button>
    </div>

    <div id="main-content">
        <h2 id="beta-text">Beta Preview</h2>
        <h1 id="hero-text">Need anything?</h1>
        <div id="chat-stream"></div>
    </div>

    <div id="input-container">
        <textarea id="userInput" placeholder="Talk With Levian..." rows="1" oninput="autoResize(this)" onkeydown="handleInput(event)"></textarea>
        <div class="controls">
             <select id="modelSelect">
                <option value="gemini-3.1-flash-lite">3.1 Flash-Lyte</option>
                <option value="gemini-3.5-flash" selected>3.5 Flash</option>
                <option value="gemini-3.1-pro">3.1 Pro</option>
             </select>
            <button class="send-btn" id="sendBtn" onclick="sendMessage(event)">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let isFirstMessage = true;
        let chatHistoryRAM = []; 
        let isCooldownActive = false; 

        const body = document.body;
        const logo = document.getElementById('hero-logo');
        const stream = document.getElementById('chat-stream');
        const input = document.getElementById('userInput');
        const modelSelect = document.getElementById('modelSelect');
        const container = document.getElementById('input-container');
        const sendBtn = document.getElementById('sendBtn');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- TOUCH & CLICK DELEGATION ---
        function focusInput(e) {
            if (isCooldownActive) return; 
            if (e.target !== modelSelect && !modelSelect.contains(e.target) && !e.target.closest('.send-btn')) {
                e.preventDefault();
                input.focus();
            }
        }
        container.addEventListener('click', focusInput);
        container.addEventListener('touchstart', focusInput, { passive: false });

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function handleInput(e) {
            if (!isMobile) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(e);
                }
            }
        }

        function triggerAppMode() {
            if (isFirstMessage) {
                body.classList.add('chat-active');
                isFirstMessage = false;
            }
        }

        function saveChat() {
            if (chatHistoryRAM.length === 0) return alert("Nothing to save yet!");
            
            let txtContent = chatHistoryRAM.map(msg => 
                `${msg.role === 'user' ? 'user' : 'Ai'}: ${msg.parts[0].text}`
            ).join('\n\n');

            const blob = new Blob([txtContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Levian_ChatLog.txt";
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- TIMER LOCKOUT SYSTEM ---
        function triggerCooldown() {
            isCooldownActive = true;
            container.classList.add('cooldown-lock');
            input.blur();
            input.disabled = true;
            sendBtn.style.opacity = '0.2';
            sendBtn.style.pointerEvents = 'none';

            let countdown = 7;
            input.placeholder = `HOLD ON... ${countdown}S`;

            const interval = setInterval(() => {
                countdown--;
                input.placeholder = `HOLD ON... ${countdown}S`;
                
                if (countdown <= 0) {
                    clearInterval(interval);
                    isCooldownActive = false;
                    container.classList.remove('cooldown-lock');
                    input.disabled = false;
                    input.placeholder = "Message Levian...";
                    sendBtn.style.opacity = '1';
                    sendBtn.style.pointerEvents = 'auto';
                }
            }, 1000);
        }

        async function sendMessage(e) {
            if(e) e.stopPropagation(); 
            
            if (isCooldownActive) return;

            const text = input.value.trim();
            if (!text) return;

            triggerAppMode(); 

            stream.innerHTML += `<div class="msg user">${escapeHTML(text)}</div>`;
            input.value = '';
            input.style.height = 'auto';
            stream.scrollTop = stream.scrollHeight;

            chatHistoryRAM.push({ role: "user", parts: [{ text: text }] });
            logo.classList.add('spinning');

            triggerCooldown();

            try {
                const selectedModel = modelSelect.value;
                const workerUrl = `https://nova-tech-web.aroush-yt31.workers.dev/levian?model=${selectedModel}`;
                
                const res = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: chatHistoryRAM }) 
                });

                // Read the raw response
                const data = await res.json();
                
                // Print it to the browser console (Press F12 to view this)
                console.log("Worker Response Data:", data); 

                let aiResponse = "";
                
                // Scenario 1: Standard Gemini API Success
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    aiResponse = data.candidates[0].content.parts[0].text;
                } 
                // Scenario 2: The API threw an error (e.g., bad API key, wrong format)
                else if (data.error) {
                    aiResponse = `API Error: ${data.error.message || JSON.stringify(data.error)}`;
                } 
                // Scenario 3: Custom Worker format or completely broken JSON
                else {
                    aiResponse = `Unknown Worker format. Press F12 to check the Console log!`;
                }
                
                stream.innerHTML += `<div class="msg ai">${escapeHTML(aiResponse)}</div>`;
                
                // Only save to history if it wasn't an error
                if (data.candidates) {
                    chatHistoryRAM.push({ role: "model", parts: [{ text: aiResponse }] });
                }

            } catch (err) {
                stream.innerHTML += `<div class="msg ai" style="color:#ff4444;">Network/Fetch Error: ${err.message}</div>`;
            }

            logo.classList.remove('spinning');
            stream.scrollTop = stream.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
