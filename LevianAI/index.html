<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Levian AI</title>
    <link rel="icon" type="image/png" href="LEVIANICON.png">
    
    <style>
        @font-face {
            font-family: 'Anurati';
            src: url('Anurati-Regular.otf') format('opentype');
        }

        :root {
            --bg-main: #000000;
            --bg-bar: #111111;
            --e-blue: #00f3ff;
            --g-yellow: #ffd700;
            --text-main: #ffffff;
            --text-muted: #555555;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* --- STATIC BRANDING ICON (Top Left) --- */
        #top-left-logo {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 35px;
            height: 35px;
            object-fit: contain;
            z-index: 110;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0.6;
        }
        #top-left-logo.thinking {
            opacity: 1;
            animation: spin 2.5s linear infinite;
            filter: drop-shadow(0 0 8px var(--e-blue));
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 70px;
            height: 100%;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 0 20px 0; /* Pushed down to clear the absolute top-left logo */
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
            position: relative;
            z-index: 10;
        }

        body.chat-active #sidebar {
            opacity: 1;
            transform: translateX(0);
        }

        .side-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 24px; transition: 0.3s;
            margin-top: auto;
        }
        .side-btn:hover { color: var(--e-blue); text-shadow: 0 0 10px var(--e-blue); }

        .save-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #aaa;
            font-size: 10px;
            padding: 10px 5px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .save-btn:hover { border-color: var(--e-blue); color: var(--e-blue); }
        .save-btn:active { border-color: var(--g-yellow); color: var(--g-yellow); }

        /* --- MAIN AREA & LANDING ELEMENTS --- */
        #main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #beta-text {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Anurati', sans-serif;
            font-size: 16px;
            letter-spacing: 5px;
            color: var(--e-blue);
            text-transform: uppercase;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: opacity 0.4s ease;
            text-align: center;
            width: 100%;
            z-index: 5;
        }

        #hero-text {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #ddd;
            transition: opacity 0.4s ease;
            text-align: center;
            width: 100%;
        }

        #hero-logo-center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 256px;
            height: 256px;
            object-fit: contain;
            z-index: 50;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        body.chat-active #beta-text { opacity: 0; pointer-events: none; }
        body.chat-active #hero-text { opacity: 0; pointer-events: none; }
        body.chat-active #hero-logo-center { opacity: 0; transform: translate(-50%, -50%) scale(0.8); pointer-events: none; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- CHAT STREAM --- */
        #chat-stream {
            flex-grow: 1;
            padding: 40px 10%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            opacity: 0;
            transition: opacity 0.8s ease 0.4s;
            padding-bottom: 140px;
        }
        body.chat-active #chat-stream { opacity: 1; }

        /* Chat Layout with Avatars */
        .msg-wrapper {
            display: flex;
            width: 100%;
            gap: 15px;
            align-items: flex-start;
        }
        .msg-wrapper.user-wrapper {
            justify-content: flex-end;
        }

        .ai-avatar {
            width: 35px;
            height: 35px;
            object-fit: contain;
            border-radius: 50%;
            border: 1px solid rgba(0, 243, 255, 0.2);
            background: #050505;
            flex-shrink: 0;
        }

        .msg { max-width: 75%; line-height: 1.6; font-size: 15px; padding: 12px 18px; border-radius: 12px; word-wrap: break-word; }
        .msg.user { background: #1a1a1a; border: 1px solid var(--border); color: #fff; }
        .msg.ai { background: transparent; color: #ccc; padding-left: 5px; }

        /* Fast Typewriter Cursor Customization */
        .typing-cursor {
            font-weight: bold;
            color: var(--e-blue);
            animation: blink 0.4s steps(2, start) infinite;
            margin-left: 2px;
        }
        @keyframes blink { to { visibility: hidden; } }

        /* --- INPUT BAR --- */
        #input-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: var(--bg-bar);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 15px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            cursor: text;
            transition: all 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 768px) { #input-container { width: 92%; } }

        #input-container:focus-within { border-color: rgba(255, 255, 255, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            resize: none;
            min-height: 24px;
            max-height: 120px;
            padding: 8px 0;
            overflow-y: auto;
        }
        
        textarea::placeholder { 
            color: var(--text-muted); 
            font-size: 14px; 
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .controls { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }

        select {
            background: #1a1a1a;
            color: #aaa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            -webkit-appearance: none;
        }
        select:focus { border-color: var(--g-yellow); }

        .send-btn {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: 0.3s;
        }
        .send-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .send-btn:hover { color: var(--e-blue); filter: drop-shadow(0 0 8px var(--e-blue)); }
    </style>
</head>
<body>

    <img src="LEVIANICON.png" id="top-left-logo" alt="Levian Core">

    <img src="LEVIANICON.png" id="hero-logo-center" alt="Levian AI">

    <div id="sidebar">
        <button class="save-btn" onclick="saveChat()">Save<br>Chat</button>
        <button class="side-btn">⚙</button>
    </div>

    <div id="main-content">
        <h2 id="beta-text">Beta Preview</h2>
        <h1 id="hero-text">Need anything?</h1>
        <div id="chat-stream"></div>
    </div>

    <div id="input-container">
        <textarea id="userInput" placeholder="Talk With Levian..." rows="1" oninput="autoResize(this)" onkeydown="handleInput(event)"></textarea>
        <div class="controls">
            <select id="modelSelect">
                <option value="gemini-3.1-flash-lite">3.1 flash-lyte</option>
                <option value="gemini-3.5-flash" selected>3.5 flash</option>
                <option value="gemini-2.5-pro">2.5 pro</option>
            </select>
            <button class="send-btn" id="sendBtn" onclick="sendMessage(event)">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let isFirstMessage = true;
        let chatHistoryRAM = []; 

        const body = document.body;
        const topLeftLogo = document.getElementById('top-left-logo');
        const stream = document.getElementById('chat-stream');
        const input = document.getElementById('userInput');
        const modelSelect = document.getElementById('modelSelect');
        const container = document.getElementById('input-container');

        // Global key capture handler
        function handleInput(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(e);
            }
        }

        function focusInput(e) {
            if (e.target !== modelSelect && !modelSelect.contains(e.target) && !e.target.closest('.send-btn')) {
                e.preventDefault();
                input.focus();
            }
        }
        container.addEventListener('click', focusInput);
        container.addEventListener('touchstart', focusInput, { passive: false });

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
        }

        function triggerAppMode() {
            if (isFirstMessage) {
                body.classList.add('chat-active');
                isFirstMessage = false;
            }
        }

        // Automatic format parse utility (Safe HTML conversion + Auto Bold & Italic matching)
        function formatMarkdown(str) {
            let clean = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            clean = clean.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            clean = clean.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            return clean.replace(/\n/g, '<br>');
        }

        // Dynamic Typewriter output simulator engine
        function runFastTypewriter(targetElement, fullRawText) {
            let i = 0;
            targetElement.innerHTML = '<span class="text-payload"></span><span class="typing-cursor">|</span>';
            const payloadContainer = targetElement.querySelector('.text-payload');
            const cursorBlock = targetElement.querySelector('.typing-cursor');
            
            const speed = 5;       // Run tick latency
            const frameStep = 4;   // Characters processed per loop iteration for rapid text tracking
            
            const printClock = setInterval(() => {
                i += frameStep;
                const slice = fullRawText.slice(0, i);
                payloadContainer.innerHTML = formatMarkdown(slice);
                
                // Smart auto-tracking scroll rules
                const userDistanceFromBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight;
                if (userDistanceFromBottom < 250) {
                    stream.scrollTop = stream.scrollHeight;
                }
                
                if (i >= fullRawText.length) {
                    clearInterval(printClock);
                    cursorBlock.remove(); // Drop text cursor gracefully upon output termination
                }
            }, speed);
        }

        function saveChat() {
            if (chatHistoryRAM.length === 0) return alert("Nothing to save yet!");
            
            let txtContent = chatHistoryRAM.map(msg => 
                `${msg.role === 'user' ? 'user' : 'Ai'}: ${msg.parts[0].text}`
            ).join('\n\n');

            const blob = new Blob([txtContent], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Levian_ChatLog.txt";
            a.click();
            URL.revokeObjectURL(url);
        }

        async function sendMessage(e) {
            if(e) e.stopPropagation(); 
            
            const text = input.value.trim();
            if (!text) return;

            triggerAppMode(); 

            // Append User prompt using markdown auto-detection formatting
            stream.innerHTML += `
                <div class="msg-wrapper user-wrapper">
                    <div class="msg user">${formatMarkdown(text)}</div>
                </div>`;
                
            input.value = '';
            input.style.height = 'auto';
            stream.scrollTop = stream.scrollHeight;

            // Injects Persona instruction guidelines directly onto initial system loop payload 
            if (chatHistoryRAM.length === 0) {
                chatHistoryRAM.push({ 
                    role: "user", 
                    parts: [{ text: "System prompt context: You are Levian AI. Act as an advanced core engine, speak with a cool, sharp, intelligent tech persona. Maintain brief, powerful, ultra-capable answers." }] 
                });
                chatHistoryRAM.push({ role: "model", parts: [{ text: "Understood. Core system initialized. Levian AI online." }] });
            }

            chatHistoryRAM.push({ role: "user", parts: [{ text: text }] });
            
            // Activate spinning animation loop on thinking trigger
            topLeftLogo.classList.add('thinking');

            try {
                const selectedModel = modelSelect.value;
                const workerUrl = `https://nova-tech-web.aroush-yt31.workers.dev/levian?model=${selectedModel}`;
                
                const res = await fetch(workerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: chatHistoryRAM }) 
                });

                const data = await res.json();
                let aiResponse = "";
                let validPayload = false;
                
                if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    aiResponse = data.candidates[0].content.parts[0].text;
                    validPayload = true;
                } else if (data.error) {
                    aiResponse = `API Error: ${data.error.message || JSON.stringify(data.error)}`;
                } else {
                    aiResponse = `Unknown format block returned from Core Worker proxy setup.`;
                }
                
                // Initialize modern message block element utilizing local profile image identity
                const aiMsgId = "ai-msg-" + Date.now();
                stream.innerHTML += `
                    <div class="msg-wrapper">
                        <img src="LEVIANICON.png" class="ai-avatar" alt="L">
                        <div class="msg ai" id="${aiMsgId}"></div>
                    </div>`;
                
                const targetElement = document.getElementById(aiMsgId);
                
                // Hand over string payload directly to our typewriter simulation engine
                runFastTypewriter(targetElement, aiResponse);
                
                if (validPayload) {
                    chatHistoryRAM.push({ role: "model", parts: [{ text: aiResponse }] });
                }

            } catch (err) {
                stream.innerHTML += `
                    <div class="msg-wrapper">
                        <img src="LEVIANICON.png" class="ai-avatar" alt="L">
                        <div class="msg ai" style="color:#ff4444;">Network Core Failure: ${err.message}</div>
                    </div>`;
            }

            // Remove spin cycle modification rules from logo asset state
            topLeftLogo.classList.remove('thinking');
            
            // Only drop view window alignment downward manually if user remains visually localized near bottom context
            if (stream.scrollHeight - stream.scrollTop - stream.clientHeight < 250) {
                stream.scrollTop = stream.scrollHeight;
            }
        }
    </script>
</body>
</html>
